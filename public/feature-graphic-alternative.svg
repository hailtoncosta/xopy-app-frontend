<svg width="1024" height="500" viewBox="0 0 1024 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="500" fill="#ea580c"/>
  
  <!-- Pattern Background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1024" height="500" fill="url(#grid)"/>
  
  <!-- Left Section - Logo -->
  <g transform="translate(150, 250)">
    <!-- White Circle Background -->
    <circle cx="0" cy="0" r="100" fill="#ffffff" opacity="0.95"/>
    
    <!-- XOPY Text -->
    <text x="0" y="10" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="900" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2">
      XOPY
    </text>
  </g>
  
  <!-- Right Section - Text Content -->
  <g transform="translate(320, 150)">
    <!-- Main Title Line 1 -->
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Marketplace da
    </text>
    
    <!-- Main Title Line 2 -->
    <text x="0" y="65" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Construção Civil
    </text>
    
    <!-- Divider Line -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
    
    <!-- Subtitle -->
    <text x="0" y="145" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#ffffff" opacity="0.95">
      Materiais • Serviços • Profissionais
    </text>
    
    <!-- Features -->
    <g transform="translate(0, 180)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#ffffff" opacity="0.9">
        ✓ Entrega Rápida
      </text>
      <text x="200" y="0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#ffffff" opacity="0.9">
        ✓ Melhores Preços
      </text>
      <text x="420" y="0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#ffffff" opacity="0.9">
        ✓ Tudo em um Lugar
      </text>
    </g>
  </g>
  
  <!-- Bottom Right - App Badge Style -->
  <g transform="translate(850, 420)">
    <rect x="0" y="0" width="140" height="50" rx="25" fill="#ffffff" opacity="0.2"/>
    <text x="70" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
      BAIXE AGORA
    </text>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="900" cy="80" r="40" fill="#ffffff" opacity="0.1"/>
  <circle cx="950" cy="120" r="25" fill="#ffffff" opacity="0.08"/>
  <circle cx="80" cy="450" r="30" fill="#ffffff" opacity="0.1"/>
</svg>
