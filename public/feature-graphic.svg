<svg width="1024" height="500" viewBox="0 0 1024 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGradient)"/>
  
  <!-- Decorative Circles -->
  <circle cx="900" cy="100" r="120" fill="url(#circleGradient)"/>
  <circle cx="100" cy="400" r="80" fill="url(#circleGradient)"/>
  <circle cx="950" cy="450" r="60" fill="url(#circleGradient)"/>
  
  <!-- Logo Circle (Left Side) -->
  <g transform="translate(120, 250)">
    <circle cx="0" cy="0" r="90" fill="#ffffff"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ea580c" text-anchor="middle" dominant-baseline="middle">
      XOPY
    </text>
  </g>
  
  <!-- Main Text -->
  <g transform="translate(280, 180)">
    <!-- Title -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">
      Marketplace da
    </text>
    <text x="0" y="75" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">
      Construção Civil
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="140" font-family="Arial, sans-serif" font-size="32" font-weight="normal" fill="#ffffff" opacity="0.95">
      Materiais • Serviços • Profissionais
    </text>
  </g>
  
  <!-- Icons (Right Side) -->
  <g transform="translate(850, 250)">
    <!-- Shopping Cart Icon -->
    <g transform="translate(-60, -40)">
      <path d="M 0 0 L 8 0 L 12 20 L 40 20 L 44 8 L 16 8" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="16" cy="28" r="3" fill="#ffffff"/>
      <circle cx="36" cy="28" r="3" fill="#ffffff"/>
    </g>
    
    <!-- Tools Icon -->
    <g transform="translate(0, -40)">
      <path d="M 8 0 L 8 32 M 0 8 L 16 8 M 4 16 L 12 16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="8" cy="36" r="4" fill="#ffffff"/>
    </g>
    
    <!-- Person Icon -->
    <g transform="translate(60, -40)">
      <circle cx="8" cy="4" r="4" fill="#ffffff"/>
      <path d="M 0 32 L 0 20 Q 0 12 8 12 Q 16 12 16 20 L 16 32" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
